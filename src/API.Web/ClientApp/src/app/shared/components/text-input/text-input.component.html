<div class="mb-3">
  <label class="form-label" [attr.for]="inputId">{{ label }}</label>
  <input
    #input
    [id]="inputId"
    [type]="type"
    class="form-control"
    [class.is-invalid]="showError"
    [attr.aria-invalid]="showError ? 'true' : null"
    [attr.aria-describedby]="showError ? inputId + '-error' : null"
    [attr.autocomplete]="autocomplete"
    (input)="onChange($any($event.target).value)"
    (blur)="onTouched()"
  />
  <div class="invalid-feedback" [id]="inputId + '-error'" *ngIf="showError">
    <span *ngIf="control?.errors?.['required']">{{ label }} is required</span>
    <span *ngIf="control?.errors?.['pattern']">Enter a valid email address</span>
    <span *ngIf="control?.errors?.['emailExists']">That email address is already registered</span>
    <span *ngIf="control?.errors?.['minlength']">{{ label }} is too short</span>
  </div>
</div>
