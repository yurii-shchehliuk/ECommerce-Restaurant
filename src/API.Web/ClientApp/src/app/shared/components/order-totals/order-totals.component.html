<section class="border rounded p-3 mb-3">
  <h2 class="h6 text-uppercase mb-3">Order summary</h2>
  <dl class="mb-0">
    <div class="d-flex justify-content-between py-2 border-bottom">
      <dt class="fw-normal text-muted">Subtotal</dt>
      <dd class="mb-0">{{ subtotal() | currency }}</dd>
    </div>
    <div class="d-flex justify-content-between py-2 border-bottom">
      <dt class="fw-normal text-muted">Shipping</dt>
      <dd class="mb-0">{{ shippingPrice() | currency }}</dd>
    </div>
    <div class="d-flex justify-content-between py-2">
      <dt class="fw-semibold">Total</dt>
      <dd class="mb-0 fw-semibold">{{ total() | currency }}</dd>
    </div>
  </dl>
</section>
