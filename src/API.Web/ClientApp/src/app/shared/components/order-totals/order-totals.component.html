<section class="totals card">
  <h2 class="totals__heading">Order summary</h2>
  <dl class="totals__list">
    <div class="totals__row">
      <dt>Subtotal</dt>
      <dd class="figure">{{ subtotal() | currency }}</dd>
    </div>
    <div class="totals__row">
      <dt>Shipping</dt>
      <dd class="figure">{{ shippingPrice() | currency }}</dd>
    </div>
    <div class="totals__row totals__row--sum">
      <dt>Total</dt>
      <dd class="figure">{{ total() | currency }}</dd>
    </div>
  </dl>
</section>
