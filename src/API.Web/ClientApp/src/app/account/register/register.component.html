<div class="shell">
  <div class="narrow-page">
    <h1 class="step-heading">Create an account</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <app-text-input formControlName="displayName" label="Display name"
        autocomplete="nickname" />
      <app-text-input formControlName="email" label="Email address" type="email"
        autocomplete="email" />
      <app-text-input formControlName="password" label="Password" type="password"
        autocomplete="new-password" />

      @if (errors.length) {
        <div class="state state--error" role="alert">
          <app-icon name="alert" [size]="18" />
          <ul class="auth__errors">
            @for (message of errors; track message) {
              <li>{{ message }}</li>
            }
          </ul>
        </div>
      }

      <button type="submit" class="btn btn-primary auth__submit"
        [disabled]="registerForm.invalid || submitting">
        {{ submitting ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth__alt">Already registered? <a routerLink="/account/login">Sign in</a>.</p>
  </div>
</div>
