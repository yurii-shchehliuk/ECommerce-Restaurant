<div class="container my-5" style="max-width: 26rem">
  <h1 class="h3 mb-4">Create an account</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <app-text-input formControlName="displayName" label="Display name"
    autocomplete="nickname" />
    <app-text-input formControlName="email" label="Email address" type="email"
    autocomplete="email" />
    <app-text-input formControlName="password" label="Password" type="password"
    autocomplete="new-password" />

    @if (errors.length) {
      <ul class="text-danger list-unstyled">
        @for (error of errors; track error) {
          <li>{{ error }}</li>
        }
      </ul>
    }

    <button type="submit" class="btn btn-primary w-100"
      [disabled]="registerForm.invalid || submitting">
      {{ submitting ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="mt-3 mb-0">Already registered? <a routerLink="/account/login">Sign in</a>.</p>
</div>
