<div class="shell">
  <div class="narrow-page">
    <h1 class="step-heading">Sign in</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <app-text-input formControlName="email" label="Email address" type="email"
        autocomplete="email" />
      <app-text-input formControlName="password" label="Password" type="password"
        autocomplete="current-password" />

      @if (error) {
        <div class="state state--error" role="alert">
          <app-icon name="alert" [size]="18" />
          <p class="state__title">{{ error }}</p>
        </div>
      }

      <button type="submit" class="btn btn-primary auth__submit"
        [disabled]="loginForm.invalid || submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth__alt">
      No account yet? <a routerLink="/account/register">Create one</a>.
    </p>
  </div>
</div>
