<div class="container my-5" style="max-width: 26rem">
  <h1 class="h3 mb-4">Sign in</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <app-text-input formControlName="email" label="Email address" type="email"
    autocomplete="email" />
    <app-text-input formControlName="password" label="Password" type="password"
    autocomplete="current-password" />

    @if (error) {
      <p class="text-danger">{{ error }}</p>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-3 mb-0">
    No account yet? <a routerLink="/account/register">Create one</a>.
  </p>
</div>
