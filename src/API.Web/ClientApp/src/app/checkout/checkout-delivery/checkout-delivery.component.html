<div class="mt-4" [formGroup]="checkoutForm()">
  <h2 class="h5 mb-3">Choose a delivery method</h2>

  @if (error) {
    <p class="text-danger">{{ error }}</p>
  }

  <fieldset formGroupName="deliveryForm" class="row g-3">
    <legend class="visually-hidden">Delivery method</legend>
    @for (method of deliveryMethods; track method.id) {
      <div class="col-md-6">
        <div class="form-check border rounded p-3 ps-5 h-100">
          <input class="form-check-input" type="radio" [id]="'delivery-' + method.id"
            [value]="method.id.toString()" formControlName="deliveryMethod"
            (change)="setShippingPrice(method)" />
          <label class="form-check-label" [for]="'delivery-' + method.id">
            <strong>{{ method.shortName }} &mdash; {{ method.price | currency }}</strong>
            <span class="d-block text-muted small">{{ method.description }}</span>
          </label>
        </div>
      </div>
    }
  </fieldset>
</div>

<div class="d-flex justify-content-between gap-2 my-4">
  <button type="button" class="btn btn-outline-secondary" cdkStepperPrevious>
    <app-icon name="chevron-left" [size]="16" /> Back to address
  </button>
  <button type="button" class="btn btn-primary"
    [disabled]="checkoutForm().controls.deliveryForm.invalid" cdkStepperNext>
    Go to review <app-icon name="chevron-right" [size]="16" />
  </button>
</div>
