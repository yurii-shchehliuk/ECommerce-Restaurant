<div class="container my-5 text-center">
  <app-icon name="check-circle" [size]="64" class="text-success" />
  <h1 class="h3 mt-3">Order confirmed</h1>
  @if (order; as placed) {
    <p class="text-muted">Order #{{ placed.id }} has been placed.</p>
    <a [routerLink]="['/orders', placed.id]" class="btn btn-primary">View this order</a>
  } @else {
    <p class="text-muted">Your order has been placed.</p>
    <a routerLink="/orders" class="btn btn-primary">View your orders</a>
  }
</div>
