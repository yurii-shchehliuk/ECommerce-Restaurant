<div class="container my-5">
  <div class="row g-4">
    <div class="col-lg-8">
      <app-stepper #appStepper>
        <cdk-step label="Address" [completed]="checkoutForm.controls.addressForm.valid">
          <app-checkout-address [checkoutForm]="checkoutForm" />
        </cdk-step>
        <cdk-step label="Delivery" [completed]="checkoutForm.controls.deliveryForm.valid">
          <app-checkout-delivery [checkoutForm]="checkoutForm" />
        </cdk-step>
        <cdk-step label="Review">
          <app-checkout-review [appStepper]="appStepper" />
        </cdk-step>
        <cdk-step label="Payment">
          <app-checkout-payment [checkoutForm]="checkoutForm" />
        </cdk-step>
      </app-stepper>
    </div>

    <div class="col-lg-4">
      @if (basketTotals$ | async; as totals) {
        <app-order-totals [shippingPrice]="totals.shipping" [subtotal]="totals.subtotal"
          [total]="totals.total" />
      }
    </div>
  </div>
</div>
