<div [formGroup]="checkoutForm()">
  <h2 class="step-heading">Payment</h2>

  @if (stripeUnavailable) {
    <div class="state state--error" role="alert">
      <app-icon name="alert" [size]="20" />
      <div>
        <p class="state__title">Stripe.js did not load</p>
        <p class="state__body">
          Card details cannot be collected here. Orders can still be placed against
          <code>POST /api/orders</code>, which is the endpoint this step calls.
        </p>
      </div>
    </div>
  }

  <div formGroupName="paymentForm">
    <app-text-input label="Name on card" autocomplete="cc-name" formControlName="nameOnCard" />
  </div>

  <div class="card-fields">
    <div class="card-fields__number">
      <span class="field-label" id="card-number-label">Card number</span>
      <div #cardNumber class="field-control card-slot" aria-labelledby="card-number-label"></div>
    </div>
    <div>
      <span class="field-label" id="card-expiry-label">Expiry</span>
      <div #cardExpiry class="field-control card-slot" aria-labelledby="card-expiry-label"></div>
    </div>
    <div>
      <span class="field-label" id="card-cvc-label">CVC</span>
      <div #cardCvc class="field-control card-slot" aria-labelledby="card-cvc-label"></div>
    </div>
  </div>

  @if (cardErrors) {
    <p class="field-error" role="alert">{{ cardErrors }}</p>
  }
</div>

<div class="step-actions">
  <button type="button" class="btn btn-ghost" cdkStepperPrevious>
    <app-icon name="chevron-left" [size]="16" /> Back to review
  </button>
  <button type="button" class="btn btn-accent" [disabled]="!canSubmit" (click)="submitOrder()">
    {{ loading ? 'Placing the order…' : 'Place the order' }}
    @if (!loading) {
      <app-icon name="arrow-right" [size]="16" />
    }
  </button>
</div>
