<div class="mt-4" [formGroup]="checkoutForm()">
  @if (stripeUnavailable) {
    <p class="text-danger">
      Stripe.js did not load, so card details cannot be collected here. Orders can
      still be placed against <code>POST /api/orders</code>.
    </p>
  }

  <div class="row" formGroupName="paymentForm">
    <div class="col-12">
      <app-text-input label="Name on card" autocomplete="cc-name" formControlName="nameOnCard" />
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label" for="cardNumber">Card number</label>
      <div #cardNumber id="cardNumber" class="form-control py-3"></div>
    </div>
    <div class="col-6 col-md-3 mb-3">
      <label class="form-label" for="cardExpiry">Expiry</label>
      <div #cardExpiry id="cardExpiry" class="form-control py-3"></div>
    </div>
    <div class="col-6 col-md-3 mb-3">
      <label class="form-label" for="cardCvc">CVC</label>
      <div #cardCvc id="cardCvc" class="form-control py-3"></div>
    </div>
  </div>

  @if (cardErrors) {
    <p class="text-danger" role="alert">{{ cardErrors }}</p>
  }
</div>

<div class="d-flex justify-content-between gap-2 my-4">
  <button type="button" class="btn btn-outline-secondary" cdkStepperPrevious>
    <app-icon name="chevron-left" [size]="16" /> Back to review
  </button>
  <button type="button" class="btn btn-primary" [disabled]="!canSubmit" (click)="submitOrder()">
    Submit order
    @if (loading) {
      <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span>
    }
  </button>
</div>
