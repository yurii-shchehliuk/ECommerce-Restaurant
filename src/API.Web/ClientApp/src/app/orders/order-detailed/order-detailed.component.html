<div class="container my-5">
  <p *ngIf="loading">Loading&hellip;</p>
  <p *ngIf="error" class="text-danger">{{ error }}</p>

  <div class="row g-4" *ngIf="order as detail">
    <div class="col-lg-8">
      <app-basket-summary [items]="detail.orderItems" [isBasket]="false" [isOrder]="true">
      </app-basket-summary>
    </div>
    <div class="col-lg-4">
      <app-order-totals [shippingPrice]="detail.shippingPrice" [subtotal]="detail.subtotal"
                        [total]="detail.total"></app-order-totals>
    </div>
  </div>
</div>
