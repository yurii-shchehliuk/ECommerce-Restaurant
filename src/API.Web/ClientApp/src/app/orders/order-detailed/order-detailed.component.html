<div class="container my-5">
  @if (loading) {
    <p>Loading&hellip;</p>
  }
  @if (error) {
    <p class="text-danger">{{ error }}</p>
  }

  @if (order; as detail) {
    <div class="row g-4">
      <div class="col-lg-8">
        <app-basket-summary [items]="detail.orderItems" [editable]="false" />
      </div>
      <div class="col-lg-4">
        <app-order-totals [shippingPrice]="detail.shippingPrice" [subtotal]="detail.subtotal"
        [total]="detail.total" />
      </div>
    </div>
  }
</div>
