<article class="product">
  <a class="product__link" [routerLink]="['/shop', product().id]">
    <div class="product__frame">
      <img class="product__image" [src]="product().pictureUrl" [alt]="product().name"
        loading="lazy" decoding="async" />
    </div>
    <div class="product__body">
      <p class="product__type">{{ product().productType }}</p>
      <h3 class="product__name">{{ product().name }}</h3>
    </div>
  </a>

  <div class="product__foot">
    <p class="product__price figure">{{ product().price | currency }}</p>
    <button type="button" class="btn btn-accent btn-sm" (click)="addItemToBasket()"
      [attr.aria-label]="'Add ' + product().name + ' to basket'">
      <app-icon name="plus" [size]="15" /> Add
    </button>
  </div>
</article>
