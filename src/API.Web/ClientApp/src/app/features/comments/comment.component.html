<section class="comments">
  <h2 class="step-heading">Comments</h2>

  @if (userName) {
    <form class="comments__compose" (ngSubmit)="send()">
      <label class="sr-only" for="comment-body">Add a comment</label>
      <input id="comment-body" class="field-control" [(ngModel)]="draft" name="draft"
        placeholder="Add a comment" autocomplete="off" />
      <button type="submit" class="btn btn-primary" [disabled]="!draft.trim()">Post</button>
    </form>
  } @else {
    <p class="comments__hint">
      <a routerLink="/account/login">Sign in</a> to leave a comment.
    </p>
  }

  <ul class="comments__list">
    @for (comment of comments; track $index) {
      <li class="comment">
        <p class="comment__head">
          <strong>{{ comment.userName }}</strong>
          <span class="comment__date figure">{{ comment.createdAt | date: 'd MMM y' }}</span>
        </p>
        <p class="comment__body">{{ comment.messageBody }}</p>
      </li>
    } @empty {
      <li class="comments__empty">No comments yet. Be the first.</li>
    }
  </ul>
</section>
