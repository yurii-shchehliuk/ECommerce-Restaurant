<div class="shell page">
  <div class="state state--error" role="alert">
    <app-icon name="alert" [size]="24" />
    <div>
      <h1 class="state__title">A service failed while handling that request</h1>
      <p class="state__body">
        The request reached a service and it threw. Refreshing usually clears it.
      </p>
    </div>
  </div>

  @if (error; as detail) {
    @if (detail.message) {
      <p class="server-error__message">{{ detail.message }}</p>
    }
    @if (detail.details) {
      <details class="server-error__details">
        <summary>Stack trace</summary>
        <pre class="figure"><code>{{ detail.details }}</code></pre>
      </details>
    }
  }

  <a routerLink="/" class="btn btn-ghost">Back to the storefront</a>
</div>
