<div class="container my-4">
  <h1 class="h4">API diagnostics</h1>
  <p class="text-muted">
    Each button calls <code>API.Identity</code>'s <code>BuggyController</code>. The
    response is handled by the application's HTTP error interceptor, so what you see
    is the real pipeline rather than a mock.
  </p>

  <h2 class="h6 text-uppercase mt-4">Status handling</h2>
  <div class="d-flex flex-wrap gap-2">
    <button *ngFor="let probe of statusProbes" type="button"
            class="btn btn-outline-primary btn-sm" (click)="run(probe)"
            [title]="probe.note">{{ probe.label }}</button>
  </div>

  <h2 class="h6 text-uppercase mt-4">Authorisation policies</h2>
  <div class="d-flex flex-wrap gap-2">
    <button *ngFor="let probe of policyProbes" type="button"
            class="btn btn-outline-secondary btn-sm" (click)="run(probe)"
            [title]="probe.note">{{ probe.label }}</button>
  </div>

  <p class="mt-4" *ngIf="lastResult" aria-live="polite">
    <code>{{ lastResult.path }}</code>
    <span class="ms-2" [class.text-success]="lastResult.ok" [class.text-danger]="!lastResult.ok">
      {{ lastResult.status }}
    </span>
  </p>

  <ul class="text-danger" *ngIf="validationErrors.length">
    <li *ngFor="let error of validationErrors">{{ error }}</li>
  </ul>
</div>
