## Owlet gateway.
##
## This used to declare one upstream (api.identity), comment out the other two, and
## proxy everything to Identity — a reverse proxy in front of a single service, while
## the browser talked to the other services directly on their published ports. That is
## why the CORS configuration in WebApi.Infrastructure is as permissive as it is.
##
## Now every request goes through here on :5200:
##
##   /                 -> api.web       (the built Angular bundle)
##   /svc/identity/    -> api.identity  (registration, sign-in, JWT issuance, SignalR)
##   /svc/basket/      -> api.basket    (basket, products, payments, orders)
##   /svc/admin/       -> api.admin     (product administration, consumed order events)
##
## The trailing slash on both the location and the proxy_pass is load-bearing: it
## strips the prefix, so /svc/basket/api/products reaches api.basket as /api/products.
##
## The /svc prefix is not decoration. The Angular router owns /basket, /admin,
## /orders, /shop, /account and /checkout, so bare /basket/ and /admin/ prefixes
## collided with real client-side routes: nginx answered a deep link to /basket with
## a 301 to /basket/ and then handed it to API.Basket, which 404s. The SPA's routes
## and the gateway's routes have to live in one namespace, and this is the cheapest
## way to keep them apart.
## src/API.Web/ClientApp/src/environment.prod.ts uses exactly these prefixes, so the
## production bundle is single-origin and needs no CORS at all.

worker_processes 1;
events { worker_connections 1024; }

http {
    sendfile on;
    large_client_header_buffers 4 32k;

    ## $http_upgrade is empty for ordinary requests and "websocket" for a WebSocket
    ## handshake; this map turns that into the right Connection header, which is what
    ## makes the upgrade work while leaving keep-alive alone on everything else.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ui {
        server api.web:80;
    }

    upstream identity {
        server api.identity:80;
    }

    upstream basket {
        server api.basket:80;
    }

    upstream admin {
        server api.admin:80;
    }

    ## Shared proxy settings, inherited by every location below.
    proxy_http_version 1.1;
    proxy_buffer_size       128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 5200;
        server_name localhost id-local.owlet.com www-local.owlet.com;

        ## Angular SPA. try_files is not used here because api.web serves its own
        ## client-side-routing fallback (UseSpa).
        location / {
            proxy_pass         http://ui;
            proxy_redirect     off;
            proxy_set_header   Host $host:5200;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }

        location /svc/identity/ {
            proxy_pass         http://identity/;
            proxy_redirect     off;
            proxy_set_header   Host $host:5200;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
            ## SignalR (/identity/chatsocket) needs the WebSocket upgrade to survive
            ## the hop; without these two headers it silently falls back to polling.
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location /svc/basket/ {
            proxy_pass         http://basket/;
            proxy_redirect     off;
            proxy_set_header   Host $host:5200;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
        }

        location /svc/admin/ {
            proxy_pass         http://admin/;
            proxy_redirect     off;
            proxy_set_header   Host $host:5200;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
        }
    }
}
